/* =========================
LOAD PRODUCTS
========================= */

function loadProducts(){

let saved=
localStorage.getItem(
"zyvoraProducts"
);


/*
IMPORTANT:
If products already exist,
keep their edited price,
stock and discount.
*/

if(saved){

try{

let savedProducts=
JSON.parse(saved);

defaultProducts.forEach(defaultProduct=>{

const exists=
savedProducts.find(
p=>Number(p.id)===Number(defaultProduct.id)
);

if(!exists){

savedProducts.push(
JSON.parse(
JSON.stringify(defaultProduct)
)
);

}

});

localStorage.setItem(
"zyvoraProducts",
JSON.stringify(savedProducts)
);

return savedProducts;

}catch(error){

localStorage.setItem(
"zyvoraProducts",
JSON.stringify(defaultProducts)
);

return JSON.parse(
JSON.stringify(defaultProducts)
);

}

}


/*
First time:
create all 30 products.
*/

localStorage.setItem(
"zyvoraProducts",
JSON.stringify(defaultProducts)
);

return JSON.parse(
JSON.stringify(defaultProducts)
);

}

/* =========================
NAVIGATION
========================= */

function showPage(page,button){

document
.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});

document
.getElementById(page)
.classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(b=>{
b.classList.remove("active");
});

button.classList.add("active");

render();

}

function editProduct(id){

const product=

);

const color=
document.getElementById(
"pColor"
).value.trim();

const sizes=
document.getElementById(
"pSizes"
).value.trim();

const description=
document.getElementById(
"pDescription"
).value.trim();


if(!name){

alert(
"Please enter product name."
);

return;

}

if(price<=0){

alert(
"Please enter a valid price."
);

return;

}

if(stock<0){

alert(
"Stock cannot be negative."
);

return;

}

if(
discount<0 ||
discount>100
){

alert(
"Discount must be between 0 and 100."
);

return;

}


/* EDIT */

if(editingId!==null){

const product=
products.find(
p=>Number(p.id)===Number(editingId)
);

if(product){

product.name=name;
product.image=image;
product.category=category;
product.price=price;
product.discount=discount;
product.stock=stock;
product.color=color;
product.sizes=sizes;
product.description=description;

}

}


/* ADD */

else{

products.push({

id:Date.now(),

name:name,

image:image,

category:category,

price:price,

discount:discount,

stock:stock,

color:color,

sizes:sizes,

description:description

});

}


/* SAVE */

localStorage.setItem(
"zyvoraProducts",
JSON.stringify(products)
);

closeProductModal();

render();

alert(
editingId!==null
?
"Product updated successfully!"
:
"Product added successfully!"
);

}


/* =========================
DELETE
========================= */

function deleteProduct(id){

if(
!confirm(
"Are you sure you want to delete this product?"
)
){

return;

}

products=
products.filter(
p=>Number(p.id)!==Number(id)
);

localStorage.setItem(
"zyvoraProducts",
JSON.stringify(products)
);

render();

}


/* =========================
PRODUCT TABLE
========================= */

function renderProducts(){

products=
JSON.parse(
localStorage.getItem(
"zyvoraProducts"
)||"[]"
);

const list=
document.getElementById(
"productList"
);

const search=
document.getElementById(
"searchProduct"
).value
.toLowerCase()
.trim();

const filtered=
products.filter(p=>

(p.name||"")
.toLowerCase()
.includes(search)

||

(p.category||"")
.toLowerCase()
.includes(search)

);

list.innerHTML="";


if(filtered.length===0){

list.innerHTML=`

<tr>

<td colspan="7"
class="empty">

No products found.

</td>

</tr>

`;

return;

}


filtered.forEach(p=>{

const discount=
Number(p.discount||0);

const finalPrice=
Math.round(
Number(p.price||0)*
(1-discount/100)
);

const image=
p.image

?

`
<img
class="product-img"
src="${escapeHTML(p.image)}"
onerror="this.style.display='none'">
`

:

`
<div class="product-img">
</div>
`;


list.innerHTML+=`

<tr>

<td>
${image}
</td>

<td>

<strong>
${escapeHTML(p.name)}
</strong>

<br>

<small>
${escapeHTML(p.color||"")}
</small>

</td>


<td>
${escapeHTML(p.category||"")}
</td>


<td>

₹${Number(p.price)
.toLocaleString("en-IN")}

${
discount>0

?

`
<br>
<small>
Final ₹${finalPrice
.toLocaleString("en-IN")}
</small>
`

:

""

}

</td>


<td>
${discount}%
</td>


<td>
${Number(p.stock||0)}
</td>


<td>

<button
class="edit"
onclick="editProduct(${p.id})">

Edit

</button>

<button
class="delete"
onclick="deleteProduct(${p.id})">

Delete

</button>

</td>

</tr>

`;

});

}

ORDERS
========================= */

JSON.parse(
localStorage.getItem(

)||"[]"
);

);

/* =========================
DASHBOARD
========================= */

function updateDashboard(){

products=
JSON.parse(
localStorage.getItem(
"zyvoraProducts"
)||"[]"
);

orders=
JSON.parse(
localStorage.getItem(
"zyvoraOrders"
)||"[]"
);


document.getElementById(
"productCount"
).textContent=
products.length;


document.getElementById(
"orderCount"
).textContent=
orders.length;


const totalSales=
orders.reduce(
(sum,o)=>
sum+
Number(o.total||0),
0
);


document.getElementById(
"sales"
).textContent=
totalSales.toLocaleString(
"en-IN"
);


const low=
products.filter(
p=>Number(p.stock)<=3
).length;


document.getElementById(
"lowStock"
).textContent=
low;


const recent=
document.getElementById(
"recentOrders"
);


if(orders.length===0){

recent.innerHTML=
"No orders yet.";

return;

}


recent.innerHTML=
orders
.slice(-5)
.reverse()
.map(o=>`

<p style="margin:10px 0">

<b>
${escapeHTML(
o.id||"ORDER"
)}
</b>

—

₹${Number(
o.total||0
).toLocaleString("en-IN")}

—

${escapeHTML(
o.status||"New"
)}

</p>

`)
.join("");

}

/* =========================
ESCAPE
========================= */

function escapeHTML(value){

return String(value??"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
RENDER ALL
========================= */

function render(){

renderProducts();

renderOrders();

updateDashboard();

loadSettings();

}


/* =========================
START
========================= */

render();
