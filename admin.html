<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ZYVORA Admin Panel</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
color:#111;
}

button{
border:0;
border-radius:10px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
}

input,
select,
textarea{
width:100%;
padding:13px;
margin:7px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
background:white;
}

textarea{
min-height:90px;
resize:vertical;
}

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#111;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
background:white;
padding:30px;
border-radius:20px;
text-align:center;
}

.logo{
font-size:32px;
font-weight:bold;
letter-spacing:8px;
margin-bottom:10px;
}

.subtitle{
color:#777;
margin-bottom:25px;
}

.login-btn{
width:100%;
background:#111;
color:white;
margin-top:10px;
}

.message{
margin-top:12px;
color:#c00;
}

#adminPanel{
display:none;
}

header{
background:#111;
color:white;
padding:18px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
font-weight:bold;
letter-spacing:5px;
}

.logout{
background:white;
color:#111;
}

.container{
max-width:1250px;
margin:auto;
padding:20px;
}

.nav{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:20px;
}

.nav button{
background:white;
border:1px solid #ddd;
}

.nav button.active{
background:#111;
color:white;
}

.page{
display:none;
}

.page.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.card strong{
display:block;
font-size:28px;
margin-top:8px;
}

.box{
background:white;
padding:20px;
border-radius:15px;
margin-top:20px;
overflow:auto;
}

.add{
background:#111;
color:white;
margin-bottom:15px;
}

.search{
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
min-width:800px;
}

th,
td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
vertical-align:middle;
}

.product-img{
width:65px;
height:65px;
object-fit:cover;
border-radius:10px;
background:#eee;
}

.delete{
background:#b00020;
color:white;
}

.edit{
background:#eee;
color:#111;
margin-right:5px;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
align-items:center;
justify-content:center;
padding:20px;
z-index:1000;
overflow:auto;
}

.modal.show{
display:flex;
}

.modal-box{
background:white;
width:100%;
max-width:520px;
padding:25px;
border-radius:18px;
max-height:95vh;
overflow:auto;
}

.modal-box h2{
margin-bottom:15px;
}

.modal-actions{
display:flex;
gap:10px;
margin-top:15px;
}

.save{
background:#111;
color:white;
flex:1;
}

.cancel{
background:#eee;
color:#111;
flex:1;
}

.store-link{
display:block;
margin-top:20px;
color:#111;
text-decoration:none;
font-weight:bold;
}

.preview{
margin-top:10px;
}

.status{
padding:7px 10px;
border-radius:20px;
background:#eee;
font-size:13px;
font-weight:bold;
}

.empty{
text-align:center;
padding:25px;
color:#777;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

@media(max-width:800px){

.cards{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:550px){

.cards{
grid-template-columns:1fr;
}

.form-grid{
grid-template-columns:1fr;
}

.container{
padding:12px;
}

header{
padding:15px;
}

}

</style>

</head>

<body>


<!-- =========================
LOGIN
========================= -->

<div class="login" id="loginScreen">

<div class="login-box">

<div class="logo">
ZYVORA
</div>

<div class="subtitle">
Premium Fashion — Admin Panel
</div>

<input
id="username"
type="text"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button
class="login-btn"
onclick="login()">

LOGIN

</button>

<div
class="message"
id="message">
</div>

<a
href="index.html"
class="store-link">

← Back to Zyvora Store

</a>

</div>

</div>



<!-- =========================
ADMIN PANEL
========================= -->

<div id="adminPanel">

<header>

<div class="brand">
ZYVORA ADMIN
</div>

<button
class="logout"
onclick="logout()">

Logout

</button>

</header>


<div class="container">


<!-- NAVIGATION -->

<div class="nav">

<button
class="active"
onclick="showPage('dashboard',this)">

📊 Dashboard

</button>

<button
onclick="showPage('products',this)">

📦 Products

</button>

<button
onclick="showPage('orders',this)">

🧾 Orders

</button>

<button
onclick="showPage('settings',this)">

⚙️ Settings

</button>

</div>



<!-- =========================
DASHBOARD
========================= -->

<div
id="dashboard"
class="page active">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">

Products

<strong id="productCount">
0
</strong>

</div>


<div class="card">

Orders

<strong id="orderCount">
0
</strong>

</div>


<div class="card">

Sales

<strong>
₹<span id="sales">0</span>
</strong>

</div>


<div class="card">

Low Stock

<strong id="lowStock">
0
</strong>

</div>

</div>


<div class="box">

<h2>
Recent Orders
</h2>

<div id="recentOrders"
class="empty">

No orders yet.

</div>

</div>

</div>



<!-- =========================
PRODUCTS
========================= -->

<div
id="products"
class="page">

<h1>
Products
</h1>

<div class="box">


<button
class="add"
onclick="openAddModal()">

+ Add Product

</button>


<input
class="search"
id="searchProduct"
placeholder="🔍 Search products..."
oninput="renderProducts()">


<table>

<thead>

<tr>

<th>Image</th>

<th>Product</th>

<th>Category</th>

<th>Price</th>

<th>Discount</th>

<th>Stock</th>

<th>Action</th>

</tr>

</thead>


<tbody
id="productList">

</tbody>

</table>

</div>

</div>



<!-- =========================
ORDERS
========================= -->

<div
id="orders"
class="page">

<h1>
Orders
</h1>

<div class="box">

<table>

<thead>

<tr>

<th>Order ID</th>

<th>Customer</th>

<th>Phone</th>

<th>Total</th>

<th>Status</th>

</tr>

</thead>

<tbody
id="orderList">

</tbody>

</table>

</div>

</div>



<!-- =========================
SETTINGS
========================= -->

<div
id="settings"
class="page">

<h1>
Settings
</h1>

<div class="box">

<label>
WhatsApp Number
</label>

<input
id="whatsapp"
placeholder="919876543210">


<label>
UPI ID
</label>

<input
id="upi"
placeholder="yourname@upi">


<button
class="save"
onclick="saveSettings()">

Save Settings

</button>


<p
id="saved"
style="margin-top:12px">

</p>

</div>

</div>


</div>

</div>



<!-- =========================
PRODUCT MODAL
========================= -->

<div
class="modal"
id="productModal">

<div class="modal-box">

<h2 id="modalTitle">
Add Product
</h2>


<label>
Product Name
</label>

<input
id="pName"
placeholder="Premium Jacket">


<label>
Image URL
</label>

<input
id="pImage"
placeholder="https://example.com/product.jpg"
oninput="previewImage()">


<img
id="imagePreview"
class="product-img preview"
style="display:none;">


<div class="form-grid">

<div>

<label>
Category
</label>

<select id="pCategory">

<option>Men</option>

<option>Women</option>

<option>Shoes</option>

<option>Accessories</option>

</select>

</div>


<div>

<label>
Price
</label>

<input
id="pPrice"
type="number"
placeholder="3999">

</div>


<div>

<label>
Discount %
</label>

<input
id="pDiscount"
type="number"
min="0"
max="100"
placeholder="10">

</div>


<div>

<label>
Stock
</label>

<input
id="pStock"
type="number"
min="0"
placeholder="20">

</div>

</div>


<label>
Colour
</label>

<input
id="pColor"
placeholder="Black">


<label>
Sizes
</label>

<input
id="pSizes"
placeholder="S, M, L, XL">


<label>
Description
</label>

<textarea
id="pDescription"
placeholder="Premium quality fashion product...">
</textarea>


<div class="modal-actions">

<button
class="save"
onclick="saveProduct()">

Save Product

</button>


<button
class="cancel"
onclick="closeProductModal()">

Cancel

</button>

</div>

</div>

</div>



<script>


/* =========================
LOGIN
========================= */

const USERNAME="admin";

const PASSWORD="zyvora123";


function login(){

const user=
document.getElementById("username").value.trim();

const pass=
document.getElementById("password").value;


if(
user===USERNAME &&
pass===PASSWORD
){

localStorage.setItem(
"zyvoraAdminLogin",
"true"
);

document.getElementById(
"loginScreen"
).style.display="none";

document.getElementById(
"adminPanel"
).style.display="block";

render();

}else{

document.getElementById(
"message"
).textContent=
"Wrong username or password.";

}

}


function logout(){

localStorage.removeItem(
"zyvoraAdminLogin"
);

location.reload();

}



/* =========================
AUTO LOGIN
========================= */

if(
localStorage.getItem(
"zyvoraAdminLogin"
)==="true"
){

document.getElementById(
"loginScreen"
).style.display="none";

document.getElementById(
"adminPanel"
).style.display="block";

}



/* =========================
DATA
========================= */

let products=JSON.parse(
localStorage.getItem(
"zyvoraProducts"
) || "[]"
);


let orders=JSON.parse(
localStorage.getItem(
"zyvoraOrders"
) || "[]"
);


let editingId=null;



/* =========================
NAVIGATION
========================= */

function showPage(page,button){

document
.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});


document
.getElementById(page)
.classList.add("active");


document
.querySelectorAll(".nav button")
.forEach(b=>{
b.classList.remove("active");
});


button.classList.add("active");

}



/* =========================
OPEN ADD
========================= */

function openAddModal(){

editingId=null;

document.getElementById(
"modalTitle"
).textContent="Add Product";


clearForm();


document.getElementById(
"productModal"
).classList.add("show");

}



/* =========================
EDIT PRODUCT
========================= */

function editProduct(id){

const product=
products.find(p=>p.id===id);

if(!product)return;

editingId=id;


document.getElementById(
"modalTitle"
).textContent="Edit Product";


document.getElementById("pName").value=
product.name || "";


document.getElementById("pImage").value=
product.image || "";


document.getElementById("pCategory").value=
product.category || "Men";


document.getElementById("pPrice").value=
product.price || "";


document.getElementById("pDiscount").value=
product.discount || 0;


document.getElementById("pStock").value=
product.stock || 0;


document.getElementById("pColor").value=
product.color || "";


document.getElementById("pSizes").value=
product.sizes || "";


document.getElementById("pDescription").value=
product.description || "";


previewImage();


document.getElementById(
"productModal"
).classList.add("show");

}



/* =========================
SAVE PRODUCT
========================= */

function saveProduct(){

const name=
document.getElementById("pName")
.value.trim();


const image=
document.getElementById("pImage")
.value.trim();


const category=
document.getElementById("pCategory")
.value;


const price=
Number(
document.getElementById("pPrice")
.value
);


const discount=
Number(
document.getElementById("pDiscount")
.value
);


const stock=
Number(
document.getElementById("pStock")
.value
);


const color=
document.getElementById("pColor")
.value.trim();


const sizes=
document.getElementById("pSizes")
.value.trim();


const description=
document.getElementById("pDescription")
.value.trim();


if(!name){

alert("Please enter product name.");

return;

}


if(price<=0){

alert("Please enter a valid price.");

return;

}


if(stock<0){

alert("Stock cannot be negative.");

return;

}


if(discount<0 || discount>100){

alert("Discount must be between 0 and 100.");

return;

}



if(editingId){

const product=
products.find(
p=>p.id===editingId
);


if(product){

product.name=name;

product.image=image;

product.category=category;

product.price=price;

product.discount=discount;

product.stock=stock;

product.color=color;

product.sizes=sizes;

product.description=description;

}

}else{

products.push({

id:Date.now(),

name:name,

image:image,

category:category,

price:price,

discount:discount,

stock:stock,

color:color,

sizes:sizes,

description:description

});

}


localStorage.setItem(
"zyvoraProducts",
JSON.stringify(products)
);


closeProductModal();

render();

alert(
editingId
? "Product updated successfully!"
: "Product added successfully!"
);

}



/* =========================
DELETE PRODUCT
========================= */

function deleteProduct(id){

if(
!confirm(
"Are you sure you want to delete this product?"
)
){

return;

}


products=
products.filter(
p=>p.id!==id
);


localStorage.setItem(
"zyvoraProducts",
JSON.stringify(products)
);


render();

}



/* =========================
PRODUCT TABLE
========================= */

function renderProducts(){

products=JSON.parse(
localStorage.getItem(
"zyvoraProducts"
) || "[]"
);


const list=
document.getElementById(
"productList"
);


const search=
document.getElementById(
"searchProduct"
).value
.toLowerCase()
.trim();


const filtered=
products.filter(p=>

(p.name || "")
.toLowerCase()
.includes(search)

||

(p.category || "")
.toLowerCase()
.includes(search)

);



list.innerHTML="";


if(filtered.length===0){

list.innerHTML=`

<tr>
<td colspan="7"
class="empty">
No products found.
</td>
</tr>

`;

return;

}



filtered.forEach(p=>{

const discount=
Number(p.discount || 0);


const finalPrice=
Math.round(
Number(p.price) *
(1-discount/100)
);


const image=
p.image
? `<img
class="product-img"
src="${escapeHTML(p.image)}"
onerror="this.style.display='none'">`
: `<div class="product-img"></div>`;


list.innerHTML+=`

<tr>

<td>
${image}
</td>

<td>
<strong>${escapeHTML(p.name)}</strong>
<br>
<small>
${escapeHTML(p.color || "")}
</small>
</td>

<td>
${escapeHTML(p.category || "")}
</td>

<td>

₹${Number(p.price)
.toLocaleString("en-IN")}

${discount>0
? `<br><small>
Final ₹${finalPrice
.toLocaleString("en-IN")}
</small>`
:""}

</td>

<td>
${discount}%
</td>

<td>
${p.stock}
</td>

<td>

<button
class="edit"
onclick="editProduct(${p.id})">

Edit

</button>

<button
class="delete"
onclick="deleteProduct(${p.id})">

Delete

</button>

</td>

</tr>

`;

});

}



/* =========================
CLEAR FORM
========================= */

function clearForm(){

document.getElementById(
"pName"
).value="";


document.getElementById(
"pImage"
).value="";


document.getElementById(
"pCategory"
).value="Men";


document.getElementById(
"pPrice"
).value="";


document.getElementById(
"pDiscount"
).value="0";


document.getElementById(
"pStock"
).value="";


document.getElementById(
"pColor"
).value="";


document.getElementById(
"pSizes"
).value="";


document.getElementById(
"pDescription"
).value="";


document.getElementById(
"imagePreview"
).style.display="none";

}



/* =========================
CLOSE MODAL
========================= */

function closeProductModal(){

document.getElementById(
"productModal"
).classList.remove("show");

}



/* =========================
IMAGE PREVIEW
========================= */

function previewImage(){

const url=
document.getElementById(
"pImage"
).value.trim();


const preview=
document.getElementById(
"imagePreview"
);


if(url){

preview.src=url;

preview.style.display="block";

}else{

preview.style.display="none";

}

}



/* =========================
ORDERS
========================= */

function renderOrders(){

orders=JSON.parse(
localStorage.getItem(
"zyvoraOrders"
) || "[]"
);


const list=
document.getElementById(
"orderList"
);


list.innerHTML="";


if(orders.length===0){

list.innerHTML=`

<tr>
<td colspan="5"
class="empty">
No orders yet.
</td>
</tr>

`;

return;

}



orders.forEach(o=>{

list.innerHTML+=`

<tr>

<td>
${escapeHTML(
o.id || "ORDER"
)}
</td>

<td>
${escapeHTML(
o.customer ||
o.name ||
"Customer"
)}
</td>

<td>
${escapeHTML(
o.phone ||
o.mobile ||
"-"
)}
</td>

<td>
₹${Number(
o.total || 0
).toLocaleString("en-IN")}
</td>

<td>

<span class="status">
${escapeHTML(
o.status || "New"
)}
</span>

</td>

</tr>

`;

});

}



/* =========================
DASHBOARD
========================= */

function updateDashboard(){

products=JSON.parse(
localStorage.getItem(
"zyvoraProducts"
) || "[]"
);


orders=JSON.parse(
localStorage.getItem(
"zyvoraOrders"
) || "[]"
);


document.getElementById(
"productCount"
).textContent=
products.length;


document.getElementById(
"orderCount"
).textContent=
orders.length;


const totalSales=
orders.reduce(
(sum,o)=>
sum+Number(o.total || 0),
0
);


document.getElementById(
"sales"
).textContent=
totalSales.toLocaleString("en-IN");


const low=
products.filter(
p=>Number(p.stock)<=3
).length;


document.getElementById(
"lowStock"
).textContent=
low;



const recent=
document.getElementById(
"recentOrders"
);


if(orders.length===0){

recent.innerHTML=
"No orders yet.";

return;

}


recent.innerHTML=
orders
.slice(-5)
.reverse()
.map(o=>`

<p style="margin:10px 0">

<b>
${escapeHTML(
o.id || "ORDER"
)}
</b>

—
₹${Number(
o.total || 0
).toLocaleString("en-IN")}

—
${escapeHTML(
o.status || "New"
)}

</p>

`)
.join("");

}



/* =========================
SETTINGS
========================= */

function loadSettings(){

document.getElementById(
"whatsapp"
).value=
localStorage.getItem(
"zyvoraWhatsApp"
) || "";


document.getElementById(
"upi"
).value=
localStorage.getItem(
"zyvoraUPI"
) || "";

}


function saveSettings(){

localStorage.setItem(
"zyvoraWhatsApp",

document.getElementById(
"whatsapp"
).value.trim()
);


localStorage.setItem(
"zyvoraUPI",

document.getElementById(
"upi"
).value.trim()
);


document.getElementById(
"saved"
).textContent=
"Settings saved successfully.";

}



/* =========================
SECURITY DISPLAY HELPER
========================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



/* =========================
RENDER ALL
========================= */

function render(){

renderProducts();

renderOrders();

updateDashboard();

loadSettings();

}



/* =========================
START
========================= */

render();


</script>

</body>
</html>
